name: EventX Alerts

on:
  schedule:
    # Every 6 hours UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Queue with SportX + Subscriber Sync so concurrent git pushes don't drop DBs
concurrency:
  group: eventx-data-persist
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore seen-events database cache
        uses: actions/cache@v4
        with:
          path: data/events.db
          key: eventx-seen-events-${{ github.run_id }}
          restore-keys: |
            eventx-seen-events-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch hackathons and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          UNSTOP_MAX_PAGES: "10"
          INCLUDE_ONLINE: "false"
        run: python main.py

      - name: Persist seen-events database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/events.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore: update seen-events database [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          fi
