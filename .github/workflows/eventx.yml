name: EventX Alerts

on:
  schedule:
    # Every 6 hours UTC (12:30 AM, 6:30 AM, 12:30 PM, 6:30 PM IST)
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: eventx-alerts
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore seen-events database
        uses: actions/cache@v4
        with:
          path: data/events.db
          key: eventx-seen-events
          restore-keys: eventx-seen-events

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch hackathons and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSTOP_MAX_PAGES: "10"
          INCLUDE_ONLINE: "false"
        run: python main.py

      - name: Generate dashboard
        env:
          UNSTOP_MAX_PAGES: "10"
          INCLUDE_ONLINE: "false"
        run: python dashboard.py

      - name: Deploy dashboard to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
