name: EventX Alerts

on:
  schedule:
    # Every 6 hours UTC (12:30 AM, 6:30 AM, 12:30 PM, 6:30 PM IST)
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: eventx-alerts
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore seen-events database
        uses: actions/cache@v4
        with:
          path: data/events.db
          key: eventx-seen-events
          restore-keys: eventx-seen-events

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch hackathons and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSTOP_MAX_PAGES: "10"
          INCLUDE_ONLINE: "false"
        run: python main.py
