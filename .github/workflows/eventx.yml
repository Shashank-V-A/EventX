name: EventX Alerts

on:
  schedule:
    # Every 6 hours UTC (12:30 AM, 6:30 AM, 12:30 PM, 6:30 PM IST)
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: eventx-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Cache is a backup. Unique key each run so updates are saved
      # (GitHub cache keys are immutable — a fixed key never updates).
      - name: Restore seen-events database cache
        uses: actions/cache@v4
        with:
          path: data/events.db
          key: eventx-seen-events-${{ github.run_id }}
          restore-keys: |
            eventx-seen-events-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch hackathons and send Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNSTOP_MAX_PAGES: "10"
          INCLUDE_ONLINE: "false"
        run: python main.py

      # Primary persistence: commit updated DB so the next run
      # checks out the full seen list and never re-alerts.
      - name: Persist seen-events database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.db data/hackathonx_subscribers.db
          if git diff --staged --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "chore: update seen-events database [skip ci]"
            git push
          fi
