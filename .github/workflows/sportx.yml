name: SportX Alerts

on:
  schedule:
    # Every 6 hours UTC (offset 30 min from HackathonX to spread load)
    - cron: "30 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sportx-alerts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore SportX seen-events database cache
        uses: actions/cache@v4
        with:
          path: data/sportx_events.db
          key: sportx-seen-events-${{ github.run_id }}
          restore-keys: |
            sportx-seen-events-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch sports events and send Telegram alerts
        env:
          SPORTX_TELEGRAM_BOT_TOKEN: ${{ secrets.SPORTX_TELEGRAM_BOT_TOKEN }}
          SPORTX_TELEGRAM_CHAT_ID: ${{ secrets.SPORTX_TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sportx_main.py

      - name: Persist SportX seen-events database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sportx_events.db
          if git diff --staged --quiet; then
            echo "No SportX database changes to commit."
          else
            git commit -m "chore: update SportX seen-events database [skip ci]"
            git push
          fi
