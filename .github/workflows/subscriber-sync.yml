name: Subscriber Sync

# Sole getUpdates poller for /start /stop /help (scans do not poll Telegram commands).

on:
  schedule:
    # Every 5 minutes — GitHub may delay scheduled runs by a few minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: eventx-data-persist
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore HackathonX subscribers cache
        uses: actions/cache@v4
        with:
          path: data/hackathonx_subscribers.db
          key: hackathonx-subscribers-${{ github.run_id }}
          restore-keys: |
            hackathonx-subscribers-

      - name: Restore SportX subscribers cache
        uses: actions/cache@v4
        with:
          path: data/sportx_subscribers.db
          key: sportx-subscribers-${{ github.run_id }}
          restore-keys: |
            sportx-subscribers-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram bot commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPORTX_TELEGRAM_BOT_TOKEN: ${{ secrets.SPORTX_TELEGRAM_BOT_TOKEN }}
          SPORTX_TELEGRAM_CHAT_ID: ${{ secrets.SPORTX_TELEGRAM_CHAT_ID }}
        run: python sync_subscribers.py
