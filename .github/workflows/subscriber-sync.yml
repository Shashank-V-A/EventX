name: Subscriber Sync

# Polls both bots for /start and /stop so people can subscribe
# without waiting for the next 6-hour scan.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: subscriber-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram bot commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SPORTX_TELEGRAM_BOT_TOKEN: ${{ secrets.SPORTX_TELEGRAM_BOT_TOKEN }}
          SPORTX_TELEGRAM_CHAT_ID: ${{ secrets.SPORTX_TELEGRAM_CHAT_ID }}
        run: python sync_subscribers.py

      - name: Persist subscriber databases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hackathonx_subscribers.db data/sportx_subscribers.db
          if git diff --staged --quiet; then
            echo "No subscriber database changes."
          else
            git commit -m "chore: update subscriber databases [skip ci]"
            git push
          fi
